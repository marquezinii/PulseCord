<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'" />
    <title>PulseCord</title>
    <style>
      :root {
        color-scheme: dark;
        --pulsecord-nav-width: 72px;
        --rail: #0d0e13;
        --rail-border: #24262f;
        --idle: #7d8496;
        --accent: #a78bfa;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background: #101218;
        color: #f3f4f7;
        font: 13px "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }
      #pulsecord-nav {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: var(--pulsecord-nav-width);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 14px 0;
        border-right: 1px solid var(--rail-border);
        background: var(--rail);
      }
      .brand {
        flex: 0 0 auto;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: url("pulsecord-logo.png") center / cover no-repeat;
        box-shadow: 0 8px 20px #0009;
      }
      .destinations {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 100%;
      }
      .destination {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 13px;
        background: transparent;
        color: var(--idle);
        cursor: pointer;
        transition: background .15s ease, color .15s ease;
      }
      .destination svg { width: 21px; height: 21px; }
      .destination:hover:not(:disabled) { background: #1a1c25; color: #e7e9ef; }
      .destination.active { background: rgba(139, 92, 246, .16); color: var(--accent); }
      .destination:disabled { opacity: .34; cursor: default; }
      .destination:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .safe-badge {
        flex: 0 0 auto;
        padding: 3px 7px;
        border-radius: 6px;
        background: rgba(236, 169, 73, .16);
        color: #f0bd70;
        font-size: 8.5px;
        font-weight: 800;
        letter-spacing: .1em;
      }
      #pulsecord-content {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: var(--pulsecord-nav-width);
        overflow: auto;
      }
      #pulsecord-content[hidden] { display: none; }
      .screen { max-width: 900px; padding: 40px 44px; }
      .screen-header h1 {
        margin: 0;
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -.03em;
      }
      .screen-header p {
        margin: 8px 0 0;
        max-width: 60ch;
        color: #949bad;
        font-size: 12.5px;
        line-height: 1.5;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
        margin-top: 28px;
      }
      .card {
        padding: 20px 22px;
        border: 1px solid #23252e;
        border-radius: 16px;
        background: #15171e;
      }
      .card h2 {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0;
        font-size: 13px;
        font-weight: 660;
      }
      .pill {
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(88, 101, 242, .14);
        color: #98a5ff;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: .04em;
      }
      .metric {
        display: block;
        margin: 14px 0 6px;
        color: var(--accent);
        font-size: 42px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -.04em;
      }
      .metric.muted { color: #4d5364; }
      .caption {
        margin: 0;
        max-width: 46ch;
        color: #8b92a4;
        font-size: 11.5px;
        line-height: 1.55;
      }
      .primary {
        margin-top: 18px;
        padding: 8px 14px;
        border: 0;
        border-radius: 9px;
        background: #8b5cf6;
        color: #fff;
        font: inherit;
        font-size: 11.5px;
        font-weight: 650;
        cursor: pointer;
      }
      .primary:hover { background: #7c4df0; }
      .primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .facts {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 9px 18px;
        margin: 16px 0 0;
        font-size: 12px;
      }
      .facts dt { color: #858c9e; }
      .facts dd { margin: 0; color: #e4e7ee; font-weight: 560; }
      .theme-layout {
        display: grid;
        grid-template-columns: minmax(220px, 260px) minmax(0, 1fr);
        gap: 20px;
        margin-top: 26px;
        align-items: start;
      }
      .theme-list { display: grid; gap: 7px; }
      .theme-list-heading {
        color: #858c9e;
        font-size: 10px;
        font-weight: 750;
        letter-spacing: .1em;
        text-transform: uppercase;
      }
      .theme-new {
        padding: 9px 12px;
        border: 1px dashed #3a3d49;
        border-radius: 10px;
        background: transparent;
        color: #b9a6f5;
        font: inherit;
        font-size: 11.5px;
        font-weight: 640;
        cursor: pointer;
      }
      .theme-new:hover:not(:disabled) { border-color: var(--accent); background: rgba(139, 92, 246, .08); }
      .theme-new:disabled { opacity: .4; cursor: not-allowed; }
      .theme-empty { margin: 6px 0 0; color: #767d8f; font-size: 11.5px; }
      .theme-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 6px;
        align-items: center;
        padding: 7px 8px;
        border: 1px solid #23252e;
        border-radius: 11px;
        background: #15171e;
      }
      .theme-item.editing { border-color: var(--accent); }
      .theme-item button { border: 0; background: transparent; font: inherit; cursor: pointer; }
      .theme-open {
        min-width: 0;
        overflow: hidden;
        padding: 3px 2px;
        color: #e4e7ee;
        font-size: 12px;
        font-weight: 600;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .theme-toggle {
        padding: 4px 8px;
        border-radius: 7px;
        background: #22242e;
        color: #a5adc0;
        font-size: 9.5px;
        font-weight: 700;
      }
      .theme-toggle.on { background: rgba(139, 92, 246, .18); color: var(--accent); }
      .theme-remove { padding: 4px 6px; color: #7c8296; font-size: 9.5px; font-weight: 650; }
      .theme-remove:hover { color: #f07889; }
      .theme-editor {
        display: grid;
        gap: 14px;
        padding: 20px 22px;
        border: 1px solid #23252e;
        border-radius: 16px;
        background: #15171e;
      }
      .field { display: grid; gap: 6px; }
      .field > span {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #949bad;
        font-size: 11px;
        font-weight: 640;
      }
      .field em { color: #6d7386; font-size: 9.5px; font-style: normal; font-variant-numeric: tabular-nums; }
      .field input,
      .field textarea {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid #2c2f3a;
        border-radius: 9px;
        outline: none;
        background: #101218;
        color: #e4e7ee;
        font: inherit;
        font-size: 12px;
      }
      .field textarea {
        min-height: 300px;
        resize: vertical;
        font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        line-height: 1.6;
        tab-size: 2;
      }
      .field input:focus,
      .field textarea:focus { border-color: var(--accent); }
      .field input:disabled,
      .field textarea:disabled { opacity: .6; cursor: wait; }
      .theme-note { margin: 0; color: #767d8f; font-size: 10.5px; line-height: 1.5; }
      .theme-status { min-height: 15px; margin: 0; font-size: 11px; font-weight: 640; }
      .theme-status[data-kind="error"] { color: #f07889; }
      .theme-status[data-kind="success"] { color: #58b88a; }
      .theme-actions { display: flex; gap: 9px; }
      .theme-actions button:not(.primary) {
        padding: 8px 13px;
        border: 1px solid #2f323d;
        border-radius: 9px;
        background: transparent;
        color: #b6bccb;
        font: inherit;
        font-size: 11.5px;
        font-weight: 620;
        cursor: pointer;
      }
      .theme-actions .primary { margin-top: 0; }
      .theme-actions button:disabled { opacity: .45; cursor: not-allowed; }
      @media (max-width: 900px) {
        .theme-layout { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <aside id="pulsecord-nav" aria-label="Navegação do PulseCord"></aside>
    <main id="pulsecord-content" hidden></main>
  </body>
</html>
